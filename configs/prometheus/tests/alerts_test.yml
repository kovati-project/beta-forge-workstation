# Unit tests for ../alerts.yml
#
# Run from configs/prometheus/ (promtool resolves rule_files relative to this file):
#   docker run --rm --entrypoint promtool \
#     -v "$PWD":/work:ro prom/prometheus test rules /work/tests/alerts_test.yml
# Input series use the REAL metric names/labels of vLLM, dcgm-exporter and
# node-exporter, so these also guard against rules drifting back to metrics
# that no exporter emits.

rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  # vLLM p95 e2e latency: every request lands in the (30s, 60s] bucket -> p95 > 30s.
  - name: vllm_high_latency_fires
    interval: 1m
    input_series:
      - series: 'vllm:e2e_request_latency_seconds_bucket{le="30.0", job="vllm-pair-a", instance="host:8000", model_name="current-model", engine="0"}'
        values: '0+0x20'
      - series: 'vllm:e2e_request_latency_seconds_bucket{le="60.0", job="vllm-pair-a", instance="host:8000", model_name="current-model", engine="0"}'
        values: '0+10x20'
      - series: 'vllm:e2e_request_latency_seconds_bucket{le="+Inf", job="vllm-pair-a", instance="host:8000", model_name="current-model", engine="0"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 3m   # before `for: 5m` has elapsed
        alertname: vLLMHighLatency
        exp_alerts: []
      - eval_time: 12m
        alertname: vLLMHighLatency
        exp_alerts:
          - exp_labels:
              severity: warning
              component: inference
              job: vllm-pair-a
              instance: "host:8000"
              model_name: current-model
            exp_annotations:
              summary: "vLLM p95 latency high"
              description: "vLLM p95 request latency 58.5s on vllm-pair-a (host:8000, model current-model)"

  # Fast server: every request lands in the le=30 bucket -> p95 < 30s -> silent.
  - name: vllm_high_latency_quiet_when_fast
    interval: 1m
    input_series:
      - series: 'vllm:e2e_request_latency_seconds_bucket{le="30.0", job="vllm-pair-a", instance="host:8000", model_name="current-model", engine="0"}'
        values: '0+10x20'
      - series: 'vllm:e2e_request_latency_seconds_bucket{le="60.0", job="vllm-pair-a", instance="host:8000", model_name="current-model", engine="0"}'
        values: '0+10x20'
      - series: 'vllm:e2e_request_latency_seconds_bucket{le="+Inf", job="vllm-pair-a", instance="host:8000", model_name="current-model", engine="0"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: vLLMHighLatency
        exp_alerts: []

  # Idle server: no new observations -> histogram_quantile is NaN -> silent.
  - name: vllm_high_latency_quiet_when_idle
    interval: 1m
    input_series:
      - series: 'vllm:e2e_request_latency_seconds_bucket{le="30.0", job="vllm-pair-a", instance="host:8000", model_name="current-model", engine="0"}'
        values: '5+0x20'
      - series: 'vllm:e2e_request_latency_seconds_bucket{le="+Inf", job="vllm-pair-a", instance="host:8000", model_name="current-model", engine="0"}'
        values: '5+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: vLLMHighLatency
        exp_alerts: []

  # CPU temperature: selected by hwmon driver name via node_hwmon_chip_names,
  # so the AMD k10temp chip matches while an NVMe sensor with the same temp does not.
  - name: cpu_high_temperature_matches_k10temp_only
    interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{chip="pci0000:00_0000:00_18_3", sensor="temp1"}'
        values: '90+0x10'
      - series: 'node_hwmon_chip_names{chip="pci0000:00_0000:00_18_3", chip_name="k10temp"}'
        values: '1+0x10'
      - series: 'node_hwmon_temp_celsius{chip="nvme_nvme0", sensor="temp1"}'
        values: '90+0x10'
      - series: 'node_hwmon_chip_names{chip="nvme_nvme0", chip_name="nvme"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: CPUHighTemperature
        exp_alerts:
          - exp_labels:
              severity: warning
              component: system
              chip: "pci0000:00_0000:00_18_3"
              chip_name: k10temp
              sensor: temp1
            exp_annotations:
              summary: "CPU temperature high"
              description: "CPU sensor temp1 (k10temp) temperature 90°C exceeds 85°C for 5 minutes"

  # FilesystemCritical must now include the root filesystem.
  - name: filesystem_critical_includes_root
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{device="/dev/nvme0n1p2", fstype="ext4", mountpoint="/"}'
        values: '1000+0x10'
      - series: 'node_filesystem_free_bytes{device="/dev/nvme0n1p2", fstype="ext4", mountpoint="/"}'
        values: '50+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: FilesystemCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: system
              device: /dev/nvme0n1p2
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Filesystem /dev/nvme0n1p2 nearly full"
              description: "Filesystem / is 95% full"

  # NVLink rule uses the real DCGM field name (..._ERROR_COUNT_TOTAL).
  - name: nvlink_errors_real_metric_name
    interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL{gpu="0"}'
        values: '3+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: NVLinkErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              component: gpu
              gpu: "0"
            exp_annotations:
              summary: "NVLink errors on GPU 0"
              description: "NVLink CRC/FLIT errors detected — interconnect degradation"

  # ── ServiceDown / ProfileServiceDown (TASK-060, #28) ──────────────────────
  # Target labels below are the ones prometheus.yml attaches: always-on jobs
  # have no profile_gated label; profile-gated vLLM jobs carry
  # profile_gated="true" and service=<container name>.

  # An always-on target that stops answering still fires ServiceDown.
  - name: service_down_fires_for_always_on_target
    interval: 1m
    input_series:
      - series: 'up{job="node-metrics", instance="node-exporter:9100", service="node"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: service
              job: node-metrics
              instance: "node-exporter:9100"
              service: node
            exp_annotations:
              summary: "Service node-metrics unavailable"
              description: "Service node-metrics (node-exporter:9100) is not responding to scrape"

  # Profile-gated targets whose container is not running (DNS error -> up 0)
  # never fire ServiceDown, and fire nothing at all while no profile expects them.
  - name: service_down_ignores_profile_gated_targets
    interval: 1m
    input_series:
      - series: 'up{job="vllm-pair-a", instance="vllm-pair-a:8000", service="vllm-pair-a", engine="vllm", profile_gated="true", gpus="0,3"}'
        values: '0+0x20'
      - series: 'up{job="vllm-pair-b", instance="vllm-pair-b:8000", service="vllm-pair-b", engine="vllm", profile_gated="true", gpus="1,2"}'
        values: '0+0x20'
      - series: 'up{job="loadout-manager", instance="loadout-manager:8800", component="gpu-orchestrator"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 15m
        alertname: ProfileServiceDown
        exp_alerts: []

  # Active profile inference-4gpu expects vllm-4gpu, which cannot be scraped:
  # ProfileServiceDown fires for it (after for: 10m), and only for it -- not
  # for vllm-pair-a (down, not expected) and not for kohya (expected by some
  # profiles but has no scrape job, so there is no `up` to join).
  - name: profile_service_down_fires_for_expected_gated_service
    interval: 1m
    input_series:
      - series: 'loadout_service_expected{job="loadout-manager", instance="loadout-manager:8800", component="gpu-orchestrator", profile="inference-4gpu", service="vllm-4gpu"}'
        values: '1+0x20'
      - series: 'loadout_service_expected{job="loadout-manager", instance="loadout-manager:8800", component="gpu-orchestrator", profile="inference-4gpu", service="kohya"}'
        values: '1+0x20'
      - series: 'up{job="vllm-4gpu", instance="vllm-4gpu:8000", service="vllm-4gpu", engine="vllm", profile_gated="true", gpus="0,1,2,3"}'
        values: '0+0x20'
      - series: 'up{job="vllm-pair-a", instance="vllm-pair-a:8000", service="vllm-pair-a", engine="vllm", profile_gated="true", gpus="0,3"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 5m    # model may still be loading: within for: 10m
        alertname: ProfileServiceDown
        exp_alerts: []
      - eval_time: 12m
        alertname: ProfileServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: service
              profile: inference-4gpu
              service: vllm-4gpu
            exp_annotations:
              summary: "Profile service vllm-4gpu unavailable"
              description: "vllm-4gpu should be running for loadout profile inference-4gpu but has not answered a scrape for 10 minutes"
      - eval_time: 12m
        alertname: ServiceDown
        exp_alerts: []

  # Expected and answering: silent.
  - name: profile_service_down_quiet_when_expected_service_is_up
    interval: 1m
    input_series:
      - series: 'loadout_service_expected{job="loadout-manager", instance="loadout-manager:8800", profile="inference-pair-a", service="vllm-pair-a"}'
        values: '1+0x20'
      - series: 'up{job="vllm-pair-a", instance="vllm-pair-a:8000", service="vllm-pair-a", engine="vllm", profile_gated="true", gpus="0,3"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ProfileServiceDown
        exp_alerts: []

  # A profile switch: loadout-manager stops exporting loadout_service_expected
  # while switching (series goes stale), so the target going down mid-switch
  # does not fire even after 10 minutes of it.
  - name: profile_service_down_quiet_after_profile_stops_expecting_it
    interval: 1m
    input_series:
      - series: 'loadout_service_expected{job="loadout-manager", instance="loadout-manager:8800", profile="inference-pair-b", service="vllm-pair-b"}'
        values: '1 1 1 stale'
      - series: 'up{job="vllm-pair-b", instance="vllm-pair-b:8000", service="vllm-pair-b", engine="vllm", profile_gated="true", gpus="1,2"}'
        values: '1 1 0+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ProfileServiceDown
        exp_alerts: []
