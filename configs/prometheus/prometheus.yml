global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ai-workstation
    host: threadripper

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Scrape addressing
# Prometheus runs inside a container, so targets are addressed from the
# container's point of view (never the host's LAN/10.x address):
#   - Services on the shared external Docker network `ai-workstation` are
#     reached by container_name:<container-internal-port> (NOT the host-published
#     port, which can differ, e.g. open-webui 3000->8080, vllm-pair-b 8001->8000).
#   - loadout-manager lives only on its own `ai-loadout` network, so it is
#     reached via host.docker.internal:<published-port>; the prometheus service
#     in docker/compose.monitoring.yml maps that name to the host gateway.
# Targets whose container is not running (e.g. profile-gated vllm-pair-b /
# vllm-4gpu) will show DOWN with a DNS error; that is expected.

scrape_configs:

  - job_name: 'gpu-dcgm'
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['dcgm-exporter:9400']
        labels:
          service: gpu
          exporter: dcgm

  - job_name: 'node-metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node

  - job_name: 'docker-containers'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: containers

  - job_name: 'loadout-manager'
    scrape_interval: 10s
    scrape_timeout: 5s
    # FIXME(TASK-060): loadout-manager exposes no Prometheus-format endpoint.
    # /health returns JSON, so this target will be reachable but still report
    # DOWN (text format parse error) until a real /metrics endpoint exists.
    # Address fixed here; the endpoint itself is intentionally not changed.
    metrics_path: /health
    static_configs:
      - targets: ['host.docker.internal:8800']
        labels:
          service: gpu-orchestrator

  - job_name: 'ollama'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      # NOTE: stock Ollama has no /metrics endpoint (404); needs a sidecar
      # exporter before this target can ever be UP.
      - targets: ['ollama:11434']
        labels:
          service: ollama
          type: inference

  - job_name: 'vllm-pair-a'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['vllm-pair-a:8000']
        labels:
          service: vllm
          profile: pair-a
          gpus: "0,3"

  - job_name: 'vllm-pair-b'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['vllm-pair-b:8000']   # host port 8001 -> container 8000
        labels:
          service: vllm
          profile: pair-b
          gpus: "1,2"

  - job_name: 'vllm-4gpu'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['vllm-4gpu:8000']     # host port 8002 -> container 8000
        labels:
          service: vllm
          profile: 4gpu
          gpus: "0,1,2,3"

  - job_name: 'comfyui'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      # NOTE: stock ComfyUI has no /metrics endpoint (404); needs a custom
      # node/exporter before this target can ever be UP.
      - targets: ['comfyui:8188']
        labels:
          service: comfyui
          type: image-gen

  - job_name: 'open-webui'
    scrape_interval: 20s
    scrape_timeout: 10s
    static_configs:
      # NOTE: container-internal port is 8080 (host 3000 -> 8080). Open WebUI
      # does not serve a Prometheus pull endpoint at /metrics in stock config
      # (telemetry is OpenTelemetry/OTLP push), so this is expected DOWN.
      - targets: ['open-webui:8080']
        labels:
          service: webui

  - job_name: 'prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus
