global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ai-workstation
    host: threadripper

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Scrape addressing
# Prometheus runs inside a container, so targets are addressed from the
# container's point of view (never the host's LAN/10.x address): every target
# is on the shared external Docker network `ai-workstation` and is reached by
# container_name:<container-internal-port> (NOT the host-published port, which
# can differ, e.g. vllm-pair-b 8001->8000). loadout-manager joined
# ai-workstation for the Alertmanager webhook, so it is scraped the same way.
#
# Every job here serves real Prometheus exposition format (TASK-060 / #28).
# Services whose stock image has no /metrics (ollama, comfyui, open-webui) are
# deliberately NOT scraped; see the note at the end of scrape_configs.
#
# Profile-gated targets
# Some containers only run while the loadout profile that owns them is active
# (loadout-manager/profiles.yaml), so their target is DOWN (DNS error) the rest
# of the time. Those jobs carry:
#   profile_gated: "true"      ServiceDown (alerts.yml) ignores them
#   service: <container name>  joined with loadout-manager's
#                              loadout_service_expected{service=...} by
#                              ProfileServiceDown, which fires only while the
#                              active profile is supposed to be running them.
# A new profile-gated job must set both labels.

scrape_configs:

  - job_name: 'gpu-dcgm'
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['dcgm-exporter:9400']
        labels:
          service: gpu
          exporter: dcgm

  - job_name: 'node-metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node

  - job_name: 'docker-containers'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: containers

  - job_name: 'loadout-manager'
    scrape_interval: 10s
    scrape_timeout: 5s
    # GET /metrics: loadout_manager_up, loadout_switching,
    # loadout_active_profile_info, loadout_service_expected, per-GPU VRAM.
    # No `service` target label here: loadout_service_expected carries its own
    # `service` label (the container it expects), which a target label of the
    # same name would rename to exported_service.
    metrics_path: /metrics
    static_configs:
      - targets: ['loadout-manager:8800']
        labels:
          component: gpu-orchestrator

  - job_name: 'vllm-pair-a'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['vllm-pair-a:8000']
        labels:
          service: vllm-pair-a
          engine: vllm
          profile_gated: "true"
          gpus: "0,3"

  - job_name: 'vllm-pair-b'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['vllm-pair-b:8000']   # host port 8001 -> container 8000
        labels:
          service: vllm-pair-b
          engine: vllm
          profile_gated: "true"
          gpus: "1,2"

  - job_name: 'vllm-4gpu'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['vllm-4gpu:8000']     # host port 8002 -> container 8000
        labels:
          service: vllm-4gpu
          engine: vllm
          profile_gated: "true"
          gpus: "0,1,2,3"

  - job_name: 'vllm-embed'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['vllm-embed:8000']    # host port 8003 -> container 8000
        labels:
          service: vllm-embed
          engine: vllm
          profile_gated: "true"
          gpus: "1"

  # Not scraped: comfyui, open-webui. Their stock images serve no
  # Prometheus endpoint (/metrics is a 404 or the web UI's HTML; Open WebUI's
  # telemetry is OTLP push), so a job for them could never be UP and only kept
  # ServiceDown firing. Container liveness and resource use for all three are
  # already covered by cadvisor (docker-containers job, `name` label). Add a
  # job back only together with an exporter that serves real metrics; if the
  # service is profile-gated, give it the profile_gated/service labels above.

  - job_name: 'prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus
