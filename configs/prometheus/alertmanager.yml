# AlertManager configuration for AI Workstation
# Receives firing alerts from Prometheus and routes them to receivers.
# Reload after editing: POST http://localhost:9093/-/reload

global:
  resolve_timeout: 5m
  smtp_smarthost: ''
  smtp_from: ''

# Inhibition rules: suppress lower-severity alerts when a higher-severity one fires
inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname, component]

route:
  # Default receiver for unmatched alerts
  receiver: log-only
  group_by: [alertname, component]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical GPU/hardware alerts → high-priority receiver
    - matchers:
        - severity = critical
        - component = gpu
      receiver: critical-gpu
      repeat_interval: 1h

    # Any critical alert → critical receiver
    - matchers:
        - severity = critical
      receiver: critical-all
      repeat_interval: 2h

    # Training alerts → training receiver
    - matchers:
        - component = training
      receiver: training
      repeat_interval: 30m

# Notification channel
# ────────────────────
# Default: the in-app channel. Every receiver posts to the Loadout Manager
# webhook (loadout-manager:8800, container name on the shared ai-workstation
# network), which records firing and resolved alerts in the alert history and
# activity feed shown on the Monitor page. For a single-user box that is the
# whole notification path: check the dashboard. If you want alerts to reach you
# off the box, add an external channel to the receivers below (example at the
# bottom of this file).
receivers:
  # Fallback for unmatched alerts
  - name: log-only
    webhook_configs:
      - &in_app
        url: http://loadout-manager:8800/api/alerts/webhook
        send_resolved: true

  # Critical GPU faults (ECC errors, NVLink failures)
  - name: critical-gpu
    webhook_configs:
      - *in_app

  # All other critical alerts
  - name: critical-all
    webhook_configs:
      - *in_app

  # Training-specific alerts
  - name: training
    webhook_configs:
      - *in_app

# Example external channel (ntfy push to a phone). Alertmanager does not expand
# environment variables, so put the topic URL in directly. Add it as a second
# webhook_configs entry on any receiver above, e.g. critical-gpu:
#
#   - name: critical-gpu
#     webhook_configs:
#       - *in_app
#       # Posts the raw Alertmanager JSON to the topic; use ntfy's message
#       # templating (see its docs) for a readable title/body.
#       - url: https://ntfy.sh/<your-private-topic>
#         send_resolved: true
#
# Example Slack receiver (incoming-webhook URL pasted in, not ${...}):
#   slack_configs:
#     - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
#       channel: '#ai-workstation-alerts'
#       title: 'AI Workstation Alert: {{ .GroupLabels.alertname }}'
#       send_resolved: true
