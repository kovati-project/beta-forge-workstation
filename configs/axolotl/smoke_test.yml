# Axolotl smoke-test config — validates the full 4-GPU training pipeline
# with a tiny synthetic dataset. Completes in ~5 min on 4x A5500.
#
# Run:
#   AXOLOTL_CONFIG=smoke_test.yml \
#   docker compose -f docker/compose.training.yml --profile training up axolotl

base_model: /workspace/models/qwen2.5-32b
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

# Keep full precision for smoke test — avoids 4-bit quant overhead
load_in_4bit: false
bf16: true
tf32: true

fsdp:
  - full_shard
  - auto_wrap
fsdp_config:
  fsdp_offload_params: false
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_transformer_layer_cls_to_wrap: Qwen2DecoderLayer

datasets:
  - path: /workspace/datasets/text/formatted
    type: alpaca
    data_files:
      - train.jsonl

dataset_prepared_path: /workspace/datasets/.cache
val_set_size: 0.02

output_dir: /workspace/outputs/smoke-test-001
sequence_len: 2048   # Short for fast smoke test
sample_packing: true

micro_batch_size: 1
gradient_accumulation_steps: 2
num_epochs: 1         # Single epoch — just verify the pipeline runs
max_steps: 20         # Cap at 20 steps regardless of dataset size
learning_rate: 2e-5
lr_scheduler: cosine
warmup_ratio: 0.05
optimizer: adamw_torch_fused

lora_r: 16            # Smaller rank for faster smoke test
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - v_proj
  - k_proj
  - o_proj

saves_per_epoch: 0    # No intermediate saves during smoke test
logging_steps: 5
