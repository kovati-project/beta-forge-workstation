# Axolotl smoke-test config — validates the full 4-GPU training pipeline
# with a tiny synthetic dataset. Completes in ~5 min on 4x A5500.
#
# Run:
#   AXOLOTL_CONFIG=smoke_test.yml \
#   docker compose -f docker/compose.training.yml --profile training up axolotl

# /data/models/vllm is mounted at /workspace/models. qwen2.5-14b (HF format,
# bf16, Qwen2) is the trainable base on the workstation today; for 32B,
# download Qwen/Qwen2.5-32B-Instruct there (Models tab) and change this path.
base_model: /workspace/models/qwen2.5-14b
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

# LoRA on bf16 weights (no 4-bit quant overhead) for the smoke test.
# Without `adapter:` axolotl ignores the lora_* keys and full fine-tunes.
adapter: lora
load_in_4bit: false
bf16: true
tf32: true

fsdp:
  - full_shard
  - auto_wrap
fsdp_config:
  # Keys as in axolotl's examples/archived/qwen2/qlora-fsdp.yaml; LoRA/QLoRA
  # under FSDP needs use_orig_params false and module-state sync.
  fsdp_limit_all_gathers: true
  fsdp_sync_module_states: true
  fsdp_offload_params: false
  fsdp_use_orig_params: false
  fsdp_cpu_ram_efficient_loading: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Qwen2DecoderLayer
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_sharding_strategy: FULL_SHARD

activation_checkpointing:
  enabled: true
  reentrant: false

datasets:
  # /data/datasets/text is mounted at /workspace/datasets, so the host path
  # is /data/datasets/text/formatted/train.jsonl
  # (scripts/convert_labelstudio_to_alpaca.py writes it).
  - path: /workspace/datasets/formatted
    type: alpaca
    data_files:
      - train.jsonl

dataset_prepared_path: /workspace/datasets/.cache
val_set_size: 0.02

output_dir: /workspace/outputs/smoke-test-001
sequence_len: 2048   # Short for fast smoke test
sample_packing: true

micro_batch_size: 1
gradient_accumulation_steps: 2
num_epochs: 1         # Single epoch — just verify the pipeline runs
max_steps: 20         # Cap at 20 steps regardless of dataset size
learning_rate: 2e-5
lr_scheduler: cosine
warmup_ratio: 0.05
optimizer: adamw_torch_fused

lora_r: 16            # Smaller rank for faster smoke test
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - v_proj
  - k_proj
  - o_proj

saves_per_epoch: 0    # No intermediate saves during smoke test
logging_steps: 5
