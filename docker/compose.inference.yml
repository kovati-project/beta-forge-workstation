name: ai-inference

services:

  # Default stack (`docker compose up -d` with no profile): vllm-4gpu serving
  # Qwen3.8-27B on all four GPUs, plus vllm-embed. Every LLM client points at
  # them: VS Code Copilot Chat, Continue.dev, OpenHands, Open WebUI, n8n, Dify.
  # Pair A and pair B share GPUs with vllm-4gpu, so they are opt-in profiles
  # (the loadout manager stops the stack before starting another profile).

  # ── vLLM: NVLink Pair A [GPU0, GPU3] ─────────────────────────────────────────
  # High-throughput serving for 32B–40B models.
  # CUDA_VISIBLE_DEVICES=0,3 maps to the confirmed NVLink bridge.
  # Model path is a symlink — update /data/models/vllm/current before starting.
  # Not started by default — use profile "pair-a" or the loadout manager.
  vllm-pair-a:
    image: vllm/vllm-openai:latest
    container_name: vllm-pair-a
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - /data/models/vllm:/models
      - /data/models/hf-cache:/root/.cache/huggingface
      - ../configs/nccl/nccl.conf:/etc/nccl.conf:ro
    environment:
      # GPU selection is handled by device_ids below; Docker renumbers the
      # reserved GPUs to 0,1 inside the container, so a CUDA_VISIBLE_DEVICES
      # listing host indices (0,3) would hide one of them and break TP=2.
      - NCCL_P2P_LEVEL=NVL
      - NCCL_SHM_DISABLE=0
      - HF_HOME=/root/.cache/huggingface
    command: >
      /models/current
      --tensor-parallel-size 2
      --max-model-len 16384
      --gpu-memory-utilization 0.92
      --max-num-seqs 64
      --enable-chunked-prefill
      --host 0.0.0.0
      --port 8000
      --served-model-name current-model
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '3']
              capabilities: [gpu]
    profiles:
      - pair-a

  # ── vLLM: NVLink Pair B [GPU1, GPU2] ─────────────────────────────────────────
  # Second independent inference slot. Same config as pair A, different GPUs/port.
  # Not started by default — use profile "pair-b" or the loadout manager.
  vllm-pair-b:
    image: vllm/vllm-openai:latest
    container_name: vllm-pair-b
    restart: unless-stopped
    ipc: host
    ports:
      - "8001:8000"
    volumes:
      - /data/models/vllm:/models
      - /data/models/hf-cache:/root/.cache/huggingface
      - ../configs/nccl/nccl.conf:/etc/nccl.conf:ro
    environment:
      # GPU selection handled by device_ids below (see pair-a note).
      - NCCL_P2P_LEVEL=NVL
      - NCCL_SHM_DISABLE=0
      - HF_HOME=/root/.cache/huggingface
    command: >
      /models/current-b
      --tensor-parallel-size 2
      --max-model-len 16384
      --gpu-memory-utilization 0.92
      --max-num-seqs 64
      --enable-chunked-prefill
      --host 0.0.0.0
      --port 8000
      --served-model-name current-model-b
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1', '2']
              capabilities: [gpu]
    profiles:
      - pair-b

  # ── vLLM: Full 4-GPU [GPU0, GPU1, GPU2, GPU3] — default LLM ──────────────────
  # Qwen3.8-27B-FP8: /models/large -> qwen3.8-27b-fp8 (loadout manager slot
  # "4gpu"). The flags below are specific to that model family (qwen3_5
  # architecture); re-check them before pointing the slot at another model.
  #
  #   TP=4          weights are 31 GB, ~7.7 GB per GPU. Only 16 of 64 layers
  #                 use full attention, so the KV cache is ~64 KB/token (bf16)
  #                 and the native 262,144-token window fits several times over.
  #                 GPU pairs 0-3 and 1-2 are NVLinked; TP=4 also crosses PCIe.
  #   0.82          leaves ~4 GB per GPU: whisper-stt shares GPU0, vllm-embed
  #                 GPU1, and CUDA graphs are allocated outside this budget.
  #   parsers       qwen3_coder emits structured (also streamed) tool calls for
  #                 Copilot agent mode, Continue and OpenHands; qwen3 splits the
  #                 thinking into reasoning_content. Thinking is on by default;
  #                 clients turn it off with chat_template_kwargs.enable_thinking.
  #   --language-model-only  skips the vision tower, which no client uses.
  #   --enable-prefix-caching  vLLM leaves it off by default for hybrid
  #                 (linear-attention) models, so every agent turn re-read the
  #                 whole conversation. vLLM picks the Mamba-state cache mode;
  #                 its support is marked experimental in 0.23.
  #   Sampling defaults come from the model's generation_config.json.
  #   Autocomplete uses /v1/completions with the Qwen FIM tokens.
  #
  # Pre-flight on this box (vLLM 0.23.0, TP=4, before prefix caching): loads in
  # ~5 min, 7.45 GiB weights/GPU (Marlin weight-only FP8 on Ampere), decode
  # ~55 tok/s, prefill ~550 tok/s, FIM autocomplete 0.4-0.6 s. Custom
  # all-reduce is off across >2 PCIe GPUs and NCCL_P2P_LEVEL=NVL routes the
  # cross-pair traffic through host memory, which limits prefill.
  vllm-4gpu:
    image: vllm/vllm-openai:v0.23.0
    container_name: vllm-4gpu
    restart: unless-stopped
    ipc: host
    ports:
      - "8002:8000"
    volumes:
      - /data/models/vllm:/models
      - /data/models/hf-cache:/root/.cache/huggingface
      - ../configs/nccl/nccl.conf:/etc/nccl.conf:ro
    environment:
      # GPU selection handled by device_ids below (see pair-a note).
      - NCCL_P2P_LEVEL=NVL
      - NCCL_SHM_DISABLE=0
      - HF_HOME=/root/.cache/huggingface
    command: >
      /models/large
      --served-model-name qwen3.8-27b
      --tensor-parallel-size 4
      --max-model-len 262144
      --gpu-memory-utilization 0.82
      --max-num-seqs 16
      --enable-prefix-caching
      --language-model-only
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1', '2', '3']
              capabilities: [gpu]

  # ── vLLM: embeddings [GPU1, ~2 GB] ───────────────────────────────────────────
  # nomic-embed-text-v1.5 for Open WebUI RAG and Continue.dev codebase search.
  # Same model Ollama served as "nomic-embed-text", under the same name, so
  # existing Open WebUI document vectors stay comparable.
  # Weights download into /data/models/hf-cache on first start. Trust-remote-code
  # is needed because the repo's config.json names a custom NomicBert config class.
  vllm-embed:
    image: vllm/vllm-openai:v0.23.0
    container_name: vllm-embed
    restart: unless-stopped
    ipc: host
    ports:
      - "8003:8000"
    volumes:
      - /data/models/hf-cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
    command: >
      nomic-ai/nomic-embed-text-v1.5
      --served-model-name nomic-embed-text
      --runner pooling
      --trust-remote-code
      --max-model-len 8192
      --gpu-memory-utilization 0.08
      --enforce-eager
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

networks:
  default:
    name: ai-workstation
    external: true
