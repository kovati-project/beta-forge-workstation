name: ai-training

services:

  # ── Kohya_ss: image LoRA and Dreambooth ───────────────────────────────────
  kohya:
    # Upstream publishes the GUI image as kohya-ss-gui; the old
    # ghcr.io/bmaltais/kohya-ss name no longer resolves (access denied).
    # The image runs as uid 1000 and its CMD already starts the GUI headless on
    # 0.0.0.0:7860 (ENTRYPOINT dumb-init), so there is no command override:
    # passing only flags would replace that CMD and nothing would start.
    image: ghcr.io/bmaltais/kohya-ss-gui:v26.0.0
    container_name: kohya
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # TODO(#68): cap_drop needs on-host verification
    ports:
      - "7860:7860"
    volumes:
      - /data/datasets/images:/dataset
      - /data/models/comfyui/loras:/output/loras
      - /data/checkpoints/kohya:/output/checkpoints
      - /data/models/comfyui/checkpoints:/models/checkpoints
    environment:
      - NVIDIA_VISIBLE_DEVICES=1,2
      - KOHYA_LOG_LEVEL=INFO
      - SAFETENSORS_FAST_GPU=1
    tmpfs:
      - /tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1', '2']
              capabilities: [gpu]

  # ── Axolotl: text model fine-tuning ───────────────────────────────────────
  # Batch service (restart: no). Set AXOLOTL_CONFIG to choose which config
  # file under /workspace/configs to train with. Defaults to qlora_4gpu.yml.
  # Launched via: docker compose --profile training up axolotl
  axolotl:
    image: winglian/axolotl:main-latest
    container_name: axolotl
    restart: no
    security_opt:
      - no-new-privileges:true
    # TODO(#68): cap_drop needs on-host verification
    command: >
      torchrun --nproc_per_node 4
      -m axolotl.cli.train
      /workspace/configs/${AXOLOTL_CONFIG:-qlora_4gpu.yml}
    volumes:
      - /data/datasets/text:/workspace/datasets
      - /data/checkpoints/axolotl:/workspace/outputs
      - /data/models/vllm:/workspace/models
      - ../configs/axolotl:/workspace/configs
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=0,1,2,3
      - NCCL_P2P_LEVEL=NVL
      - NCCL_SHM_DISABLE=0
      - WANDB_DISABLED=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1', '2', '3']
              capabilities: [gpu]
    profiles:
      - training

  # ── Unsloth: fast LoRA (1-2 GPU) ─────────────────────────────────────────
  # Official image (#95). unslothai/unsloth no longer exists. The image serves
  # Unsloth Studio on :8000 and JupyterLab on :8888 inside the container; both
  # are published on free host ports because 8000 is vLLM pair A and 8888 is
  # the jupyterlab service. Its own state lives in /workspace and
  # /opt/unsloth-studio, so the host data is mounted under /workspace/host
  # instead of on top of the image's notebooks.
  # Both passwords come from docker/.env (generated by init-secrets.sh and the
  # setup wizard). If one is empty the image generates its own on first start.
  # Requires NVIDIA driver >= 570 (image is built on CUDA 12.8).
  unsloth:
    image: unsloth/unsloth:${UNSLOTH_TAG:-v0.1.924-beta}
    container_name: unsloth
    restart: no
    security_opt:
      - no-new-privileges:true
    # TODO(#68): cap_drop needs on-host verification
    ports:
      - "8501:8000"   # Unsloth Studio (host port unchanged from before #95)
      - "8889:8888"   # JupyterLab
    volumes:
      - /data/unsloth/workspace:/workspace
      - /data/unsloth/studio:/opt/unsloth-studio
      - /data/datasets/text:/workspace/host/datasets
      - /data/checkpoints/unsloth:/workspace/host/outputs
      - /data/models/vllm:/workspace/host/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=0,3
      - NCCL_P2P_LEVEL=NVL
      - UNSLOTH_STUDIO_PASSWORD=${UNSLOTH_STUDIO_PASSWORD:-}
      - JUPYTER_PASSWORD=${UNSLOTH_JUPYTER_PASSWORD:-}
      - HF_TOKEN=${HUGGINGFACE_TOKEN:-}
      - WANDB_API_KEY=${WANDB_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '3']
              capabilities: [gpu]
    profiles:
      - training

  # ── Label Studio: training data annotation ────────────────────────────────
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # TODO(#68): cap_drop needs on-host verification
    ports:
      - "8081:8080"
    volumes:
      - label-studio-data:/label-studio/data
      - /data/datasets:/label-studio/files
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files
      - LABEL_STUDIO_USERNAME=admin@local.dev
      - LABEL_STUDIO_PASSWORD=${LABEL_STUDIO_PASSWORD:-admin}

  # ── JupyterLab: experimentation ───────────────────────────────────────────
  jupyterlab:
    image: quay.io/jupyter/pytorch-notebook:cuda12-pytorch-2.4.0
    container_name: jupyterlab
    restart: unless-stopped
    # runs as jovyan; GRANT_SUDO is not set. Drop no-new-privileges if sudo
    # inside notebooks is ever enabled, since sudo needs setuid.
    security_opt:
      - no-new-privileges:true
    # TODO(#68): cap_drop needs on-host verification
    ports:
      - "8888:8888"
    volumes:
      - /data/notebooks:/home/jovyan/work
      - /data/models:/home/jovyan/models
      - /data/datasets:/home/jovyan/datasets
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-changeme}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

volumes:
  label-studio-data:

networks:
  default:
    name: ai-workstation
    external: true
