name: ai-webui

services:

  # ── Open WebUI: unified chat and inference UI ───────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
      - /data/models/ollama:/root/.ollama
    environment:
      # Backends are addressed by container name and *internal* port on the
      # ai-workstation network; 10.10.10.2 never existed on this host (#51).
      # Open WebUI keeps no saved connection settings in its DB here, so these env
      # vars are authoritative (re-check webui.db `config` if that ever changes).

      # Ollama backend (primary)
      - OLLAMA_BASE_URL=http://ollama:11434

      # vLLM backends (OpenAI-compatible; the base URL must end in /v1). pair-b and
      # 4gpu only resolve while the loadout-manager has that profile running.
      - OPENAI_API_BASE_URLS=http://vllm-pair-a:8000/v1;http://vllm-pair-b:8000/v1;http://vllm-4gpu:8000/v1
      - OPENAI_API_KEYS=EMPTY;EMPTY;EMPTY

      # Image generation via ComfyUI
      - ENABLE_IMAGE_GENERATION=true
      - IMAGE_GENERATION_ENGINE=comfyui
      - COMFYUI_BASE_URL=http://comfyui:8188

      # RAG
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      - RAG_EMBEDDING_ENGINE=ollama
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=100

      # Web search via SearXNG
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      # needs `json` in search.formats of configs/searxng/settings.yml
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json

      # Auth
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_SIGNUP=false
      - DEFAULT_USER_ROLE=user

      # Voice I/O pre-wiring (endpoints deployed in Phase 12)
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://whisper:8000/v1
      - AUDIO_STT_OPENAI_API_KEY=EMPTY
      - AUDIO_TTS_ENGINE=openai
      # KNOWN BROKEN: piper speaks the Wyoming protocol (raw TCP), not the OpenAI
      # speech API, so TTS cannot work until an OpenAI-compatible TTS server replaces it.
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://piper:10200/v1
      - AUDIO_TTS_OPENAI_API_KEY=EMPTY

      # Features
      - ENABLE_CODE_EXECUTION=true
      - ENABLE_COMMUNITY_SHARING=false

    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── SearXNG: self-hosted web search ────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../configs/searxng:/etc/searxng

volumes:
  open-webui-data:

networks:
  default:
    name: ai-workstation
    external: true
