name: ai-caddy

services:

  # ── Caddy: reverse proxy + TLS + Authentik SSO ───────────────────────────
  # Sits in front of all services. Uses forward_auth to gate access via
  # Authentik. The Caddyfile lives at /data/caddy/Caddyfile on the host
  # (copied from configs/caddy/Caddyfile.security during deploy).
  #
  # SETUP (one-time on host):
  #   mkdir -p /data/caddy/certs /data/caddy/config /var/log/caddy
  #   cp configs/caddy/Caddyfile.security /data/caddy/Caddyfile
  #
  # Caddy resolves `authentik:9000` via the shared ai-auth bridge network, and
  # the proxied services by container name via ai-workstation / ai-loadout.
  # All three networks must exist before starting caddy: ai-auth (compose.auth.yml),
  # ai-workstation (scripts/migrate-network.sh), ai-loadout (compose.loadout.yml).
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /data/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy/certs:/data
      - caddy-config:/config
      - /var/log/caddy:/var/log/caddy
    networks:
      - ai-auth
      - ai-workstation
      - ai-loadout
    healthcheck:
      # :80 redirects to HTTPS and there is no cert for localhost, so probe the admin API
      # (bound to 127.0.0.1 only; busybox resolves localhost to ::1 first)
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ai-auth:
    external: true
    name: ai-auth
  ai-workstation:
    external: true
    name: ai-workstation
  ai-loadout:
    external: true
    name: ai-loadout

volumes:
  caddy-config:
