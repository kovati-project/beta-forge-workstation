name: ai-loadout-mgr

services:

  loadout-manager:
    build:
      context: ../loadout-manager
      dockerfile: Dockerfile
    image: loadout-manager:latest
    container_name: loadout-manager
    restart: unless-stopped
    ports:
      - "8800:8800"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./:/compose:ro
      # docker/.env read-write on top of the read-only /compose, so the Secrets
      # page and the setup wizard can update it. Must exist before `up` (run
      # scripts/init-secrets.sh); never let docker create it as a directory.
      - type: bind
        source: ./.env
        target: /compose/.env
        bind:
          create_host_path: false
      - ../loadout-manager:/app:ro
      - /data/models/vllm:/data/models/vllm
      # persisted active-profile state (LOADOUT_STATE_PATH default); lost on recreate without this
      - /data/loadout-manager:/data/loadout-manager
      # scripts/backup.sh runs (read-only: the backup API runs and deletes them
      # through helper containers, see api/backup.py)
      - /data/backups:/data/backups:ro
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - COMPOSE_DIR=/compose
      - ENV_FILE=/compose/.env
      - HOST_COMPOSE_DIR=${REPO_ROOT:-/home/kasemo/ai-workstation-project}/docker
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai-loadout

networks:
  ai-loadout:
    name: ai-loadout
    driver: bridge
