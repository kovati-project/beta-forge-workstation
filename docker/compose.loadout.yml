name: ai-loadout-mgr

services:

  loadout-manager:
    build:
      context: ../loadout-manager
      dockerfile: Dockerfile
    image: loadout-manager:latest
    container_name: loadout-manager
    restart: unless-stopped
    ports:
      - "8800:8800"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./:/compose:ro
      # docker/.env read-write on top of the read-only /compose, so the Secrets
      # page and the setup wizard can update it. Must exist before `up` (run
      # scripts/init-secrets.sh); never let docker create it as a directory.
      - type: bind
        source: ./.env
        target: /compose/.env
        bind:
          create_host_path: false
      - ../loadout-manager:/app:ro
      - /data/models/vllm:/data/models/vllm
      # persisted active-profile state (LOADOUT_STATE_PATH default); lost on recreate without this
      - /data/loadout-manager:/data/loadout-manager
      # scripts/backup.sh runs (read-only: the backup API runs and deletes them
      # through helper containers, see api/backup.py)
      - /data/backups:/data/backups:ro
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - COMPOSE_DIR=/compose
      - ENV_FILE=/compose/.env
      - HOST_COMPOSE_DIR=${REPO_ROOT:-/home/kasemo/ai-workstation-project}/docker
      # Alertmanager by container name over ai-workstation (GET /api/alerts);
      # Alertmanager posts back to http://loadout-manager:8800/api/alerts/webhook.
      - ALERTMANAGER_URL=http://alertmanager:9093
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Admin panel (api/admin.py). Authentik is on the ai-auth network, so it
      # is reached through its published port on the host. AUTHENTIK_TOKEN is an
      # API token created in Authentik (Directory -> Tokens, intent "API").
      - AUTHENTIK_URL=${AUTHENTIK_URL:-http://host.docker.internal:9080}
      - AUTHENTIK_TOKEN=${AUTHENTIK_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai-loadout
      # shared with compose.monitoring.yml so Alertmanager can reach the
      # alert webhook by container name (configs/prometheus/alertmanager.yml)
      - ai-workstation

networks:
  ai-loadout:
    name: ai-loadout
    driver: bridge
  ai-workstation:
    name: ai-workstation
    external: true
