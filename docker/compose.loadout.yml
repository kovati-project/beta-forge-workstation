services:

  loadout-manager:
    build:
      context: ../loadout-manager
      dockerfile: Dockerfile
    image: loadout-manager:latest
    container_name: loadout-manager
    restart: unless-stopped
    ports:
      - "8800:8800"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./:/compose:ro
      - ../loadout-manager:/app:ro
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - COMPOSE_DIR=/compose
      - HOST_COMPOSE_DIR=${REPO_ROOT}/docker
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai-loadout

networks:
  ai-loadout:
    name: ai-loadout
    driver: bridge
