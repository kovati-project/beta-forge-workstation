name: ai-codegen

services:

  # ── OpenHands: Autonomous coding agent ────────────────────────────────────
  # Uses vllm-4gpu (compose.inference.yml) over the shared ai-workstation network,
  # so no host IP is hardcoded. Each conversation runs in a separate sandbox
  # container started through the Docker socket; the server reaches it via
  # host.docker.internal.
  openhands:
    image: ghcr.io/all-hands-ai/openhands:0.59
    container_name: openhands
    restart: unless-stopped
    ports:
      - "3003:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # settings, secrets and conversation history survive restarts
      - /data/openhands/state:/.openhands
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:0.59-nikolaik
      - SANDBOX_VOLUMES=/data/openhands/workspace:/workspace:rw
      # vllm-4gpu (compose.inference.yml) serves Qwen3.8-27B with a 262,144-
      # token window; input + output must fit in it, and thinking tokens count
      # as output. These env values seed OpenHands' saved settings only on
      # first start; deploy-phase11.sh syncs model and base URL afterwards.
      - LLM_MODEL=openai/qwen3.8-27b
      - LLM_BASE_URL=http://vllm-4gpu:8000/v1
      - LLM_MAX_INPUT_TOKENS=229376
      - LLM_MAX_OUTPUT_TOKENS=32768
      - LLM_API_KEY=local-llm
      - LLM_TIMEOUT=600
      - LOG_ALL_EVENTS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: ai-workstation
    external: true
